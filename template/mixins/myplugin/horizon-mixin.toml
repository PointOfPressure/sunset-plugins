[mod]
id = "myplugin"
version = "0.1.0"
priority = 100

# The same Horizon commit as the Sunset it plugs into (Sunset's horizon-native.json says which).
[compatibility]
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

# Your code: plugin.rs becomes a module of the game's source.
[[module]]
id = "plugin"
file = "crates/horizon-client/src/game.rs"
name = "myplugin_plugin"
source = "plugin.rs"

# Horizon's tick hook calls tick.rs, which calls your plugin.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
